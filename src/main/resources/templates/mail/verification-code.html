<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>[든든] ${purpose} 이메일 인증 코드</title>
</head>
<body style="margin:0;padding:0;background-color:#FFF7F0;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#FFF7F0;padding:40px 16px;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background-color:#FFFFFF;border-radius:16px;overflow:hidden;">
        <tr>
          <td style="background-color:#F97316;padding:28px 32px;">
            <span style="font-size:26px;font-weight:800;color:#FFFFFF;letter-spacing:-0.5px;">든든</span>
          </td>
        </tr>
        <tr>
          <td style="padding:36px 32px 12px;">
            <p style="margin:0 0 12px;font-size:20px;font-weight:700;color:#363636;">${purpose} 인증 코드</p>
            <p style="margin:0;font-size:15px;line-height:1.6;color:#555555;">아래 인증 코드를 앱에 입력해 주세요.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px;">
            <div style="background-color:#FFF1E6;border:1px solid #FED7AA;border-radius:12px;padding:24px 0;text-align:center;">
              <span style="font-size:34px;font-weight:800;letter-spacing:10px;color:#F97316;">${code}</span>
            </div>
          </td>
        </tr>
        <tr>
          <td style="padding:4px 32px 36px;">
            <p style="margin:0;font-size:14px;line-height:1.6;color:#555555;">인증 코드는 <strong style="color:#F97316;">${minutes}분</strong> 동안만 사용할 수 있습니다.</p>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px;background-color:#FAFAFA;border-top:1px solid #EEEEEE;">
            <p style="margin:0;font-size:12px;line-height:1.6;color:#999999;">본인이 요청하지 않았다면 이 메일을 무시해 주세요.<br>이 메일은 발신 전용입니다.</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
